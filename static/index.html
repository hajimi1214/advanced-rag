<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能知识库问答系统</title>
<style>
  :root {
    --bg: #f4f5f9;
    --card: #ffffff;
    --border: #e6e8f0;
    --text: #1d2333;
    --muted: #7b8194;
    --primary: #4f46e5;
    --primary-light: #eef0ff;
    --green: #12b76a;
    --green-bg: #eafaf1;
    --amber-bg: #fff7e6;
    --amber: #b45309;
    --radius: 14px;
    --mono: "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 14px 24px; display: flex; align-items: center; gap: 14px; flex-shrink: 0;
  }
  header .logo {
    width: 36px; height: 36px; border-radius: 10px; background: var(--primary);
    color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  header h1 { font-size: 16px; font-weight: 700; }
  header .sub { font-size: 12px; color: var(--muted); }
  header .spacer { flex: 1; }
  .stat-chip {
    font-size: 12px; color: var(--primary); background: var(--primary-light);
    border-radius: 20px; padding: 5px 12px; font-weight: 600;
  }
  .upload-btn {
    font-size: 13px; font-weight: 600; color: #fff; background: var(--primary);
    border: none; border-radius: 10px; padding: 8px 16px; cursor: pointer; transition: .15s;
  }
  .upload-btn:hover { background: #4338ca; }
  .upload-btn:disabled { opacity: .5; cursor: wait; }

  #chat { flex: 1; overflow-y: auto; padding: 24px; }
  .inner { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  .msg { display: flex; gap: 10px; animation: fadein .25s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
  .avatar {
    width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .msg.user .avatar { background: #e2e5ef; }
  .msg.ai .avatar { background: var(--primary); color: #fff; }
  .bubble {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 16px; font-size: 14px; line-height: 1.75; max-width: 85%;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: var(--primary); color: #fff; border: none; }

  .cites { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .cite {
    background: var(--green-bg); border-radius: 10px; padding: 9px 12px; font-size: 12.5px;
  }
  .cite .cite-head { display: flex; gap: 8px; align-items: center; font-weight: 600; color: #0e6f4c; margin-bottom: 3px; }
  .cite .cite-src { font-family: var(--mono); font-size: 11px; background: #d5f2e3; border-radius: 6px; padding: 1px 7px; }
  .cite .cite-text { color: #33544a; }

  .mode-note { margin-top: 8px; font-size: 12px; color: var(--amber); background: var(--amber-bg); border-radius: 8px; padding: 6px 10px; }

  .typing { display: inline-flex; gap: 5px; padding: 6px 2px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: #b9bdd1; animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .3; } 40% { opacity: 1; } }

  footer { flex-shrink: 0; background: var(--card); border-top: 1px solid var(--border); padding: 14px 24px 18px; }
  .input-bar { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; }
  .input-bar input {
    flex: 1; border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px;
    font-size: 14px; outline: none; transition: .15s;
  }
  .input-bar input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
  .send-btn {
    background: var(--primary); color: #fff; border: none; border-radius: 12px;
    padding: 0 22px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .send-btn:hover { background: #4338ca; }
  .send-btn:disabled { opacity: .5; cursor: wait; }
  .hint { max-width: 820px; margin: 8px auto 0; font-size: 11.5px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<header>
  <div class="logo">🧠</div>
  <div>
    <h1>智能知识库问答系统</h1>
    <div class="sub">进阶 RAG · 混合检索 + RRF 融合 · 答案溯源</div>
  </div>
  <div class="spacer"></div>
  <span class="stat-chip" id="statChip">📚 知识库加载中…</span>
  <button class="upload-btn" id="uploadBtn" onclick="document.getElementById('fileInput').click()">＋ 上传文档</button>
  <input type="file" id="fileInput" accept=".pdf,.docx,.md,.txt" hidden multiple onchange="uploadFiles(this.files)">
</header>

<div id="chat"><div class="inner" id="chatInner"></div></div>

<footer>
  <div class="input-bar">
    <input id="questionInput" placeholder="输入问题，回车发送（例如：树莓派是什么？）" autocomplete="off">
    <button class="send-btn" id="sendBtn" onclick="ask()">发送</button>
  </div>
  <div class="hint">答案基于已上传的文档检索生成 · 每条结论都标注来源引用</div>
</footer>

<script>
const chatInner = document.getElementById('chatInner');
const input = document.getElementById('questionInput');
const sendBtn = document.getElementById('sendBtn');
const uploadBtn = document.getElementById('uploadBtn');

function el(html) { const d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }
function scroll() { document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight; }

function addWelcome() {
  chatInner.appendChild(el(`<div class="msg ai"><div class="avatar">🧠</div>
    <div class="bubble">你好！我是你的知识库助手 👋
点击右上角「上传文档」，把 PDF / Word / Markdown 丢进来，然后就能用自然语言提问。
我会从文档里检索最相关的片段来回答，<b>每条答案都标注来源</b>——绝不瞎编。</div></div>`));
}

async function loadStats() {
  try {
    const r = await fetch('/stats');
    const d = await r.json();
    document.getElementById('statChip').textContent = `📚 知识库 ${d.total_chunks} 个片段`;
  } catch { document.getElementById('statChip').textContent = '📚 服务未连接'; }
}

async function uploadFiles(files) {
  if (!files.length) return;
  for (const f of files) {
    uploadBtn.disabled = true; uploadBtn.textContent = '上传中…';
    chatInner.appendChild(el(`<div class="msg ai"><div class="avatar">🧠</div>
      <div class="bubble" id="up-${f.name}">⏳ 正在解析并入库 <b>${f.name}</b> …</div></div>`));
    scroll();
    try {
      const fd = new FormData();
      fd.append('file', f);
      const r = await fetch('/ingest', { method: 'POST', body: fd });
      const d = await r.json();
      if (d.ok) {
        document.getElementById('up-' + f.name).innerHTML =
          `✅ <b>${f.name}</b> 入库成功：解析出 <b>${d.chunks}</b> 个知识片段`;
      } else {
        document.getElementById('up-' + f.name).innerHTML = `❌ ${f.name} 入库失败：${d.detail || '未知错误'}`;
      }
    } catch {
      document.getElementById('up-' + f.name).innerHTML = `❌ ${f.name} 上传失败（服务未连接）`;
    }
    loadStats();
  }
  uploadBtn.disabled = false; uploadBtn.textContent = '＋ 上传文档';
  scroll();
}

function citationHTML(c, i) {
  const src = (c.source || '').split('/').pop();
  return `<div class="cite"><div class="cite-head">📎 引用 [${i + 1}]
    <span class="cite-src">${src}</span><span>相关度 ${(c.score * 100).toFixed(0)}%</span></div>
    <div class="cite-text">${c.text.slice(0, 120)}${c.text.length > 120 ? '…' : ''}</div></div>`;
}

async function ask() {
  const q = input.value.trim();
  if (!q) return;
  input.value = ''; sendBtn.disabled = true;

  chatInner.appendChild(el(`<div class="msg user"><div class="avatar">🧑</div><div class="bubble"></div></div>`));
  chatInner.lastElementChild.querySelector('.bubble').textContent = q;
  scroll();

  const typing = el(`<div class="msg ai"><div class="avatar">🧠</div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div>`);
  chatInner.appendChild(typing); scroll();

  try {
    const r = await fetch('/ask', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, top_k: 5 }),
    });
    const d = await r.json();
    typing.remove();

    const cites = (d.contexts || []).map(citationHTML).join('');
    let body;
    if (d.answer) {
      body = d.answer;
    } else {
      body = `在知识库中找到了 ${d.contexts.length} 个相关片段：`;
    }
    const note = d.mode === 'retrieval_only'
      ? `<div class="mode-note">ℹ️ 当前未配置 LLM（在环境变量设置 OPENAI_API_KEY 或启动本地 Ollama 即可生成完整答案），以上为混合检索结果</div>` : '';

    chatInner.appendChild(el(`<div class="msg ai"><div class="avatar">🧠</div>
      <div class="bubble"><div></div><div class="cites">${cites}</div>${note}</div></div>`));
    chatInner.lastElementChild.querySelector('.bubble > div').textContent = body;
  } catch {
    typing.remove();
    chatInner.appendChild(el(`<div class="msg ai"><div class="avatar">🧠</div>
      <div class="bubble">⚠️ 请求失败，请确认服务已启动（run.sh）</div></div>`));
  }
  sendBtn.disabled = false; input.focus(); scroll();
}

input.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
addWelcome();
loadStats();
</script>
</body>
</html>
